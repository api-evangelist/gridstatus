serviceCategory: Analytics and Data
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Grid Status API
  ServiceCategory: Analytics and Data
  ProviderName: Grid Status
  PublisherName: Grid Status
  InvoiceIssuerName: Grid Status
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: api_rows_returned
  description: Rows returned by dataset query responses; the primary metered unit against the monthly plan allowance.
  unit: rows
  aggregation: sum
  dimensions:
  - account
  - dataset
  - iso
- name: api_requests
  description: API requests made in the billing period, tracked against the plan requests limit.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: bulk_csv_downloads
  description: Per-day bulk CSV export files downloaded via presigned S3 URLs.
  unit: files
  aggregation: sum
  dimensions:
  - account
  - dataset
- name: open_source_compute
  description: Your own compute and maintenance cost when pulling raw ISO/RTO data with the free gridstatus library (no Grid Status invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Poll GET /api_usage to track rows returned and requests against plan limits during the current billing period; alert before the allowance is exhausted.
- name: Allocation
  description: Issue separate API keys per team or workload where possible, and tag internal consumers by dataset and ISO so row consumption maps to cost centers.
- name: Optimization
  description: Bound every query with limit, request only needed columns, resample to the coarsest frequency the use case allows, poll dataset-updates before re-querying, and prefer bulk CSV exports for historical backfills; scope paid plans to only the ISOs/RTOs you need.
- name: Accountability
  description: Assign an owner per API key; review monthly rows-returned consumption against the plan allowance and decide between plan changes and shifting bulk work to exports or the open-source library.
