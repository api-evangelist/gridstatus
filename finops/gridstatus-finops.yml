description: >-
  FinOps view of Grid Status spend. The open-source gridstatus Python library is
  free (BSD-3-Clause) - in that model your cost is your own compute and the
  operational burden of scraping raw ISO/RTO sources yourself. The hosted Grid
  Status API is metered on rows returned per month above a free allowance
  (documented at 500,000 rows per month on the free plan), with paid plans that
  raise row and rate limits and can be scoped to just the ISOs/RTOs you need.
  Daily peak reports and other premium surfaces require a paid plan. Enterprise
  arrangements, including data delivery in Snowflake, are negotiated directly.
notes: >-
  Paid per-unit rates are not reconciled here; verify on the Grid Status pricing
  page. The dominant cost driver is rows returned - real-time price datasets
  consume allowance very quickly, so bound every query with limit, select only
  needed columns, resample to coarser frequencies where possible, and use bulk
  CSV exports for large historical backfills.
