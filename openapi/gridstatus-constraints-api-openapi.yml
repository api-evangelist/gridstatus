components:
  schemas:
    ConstraintIntervalResponse:
      properties:
        year:
          type: integer
          title: Year
        count:
          type: integer
          title: Count
        months:
          anyOf:
          - items:
              $ref: '#/components/schemas/ConstraintIntervalMonthResponse'
            type: array
          - type: 'null'
          title: Months
      type: object
      required:
      - year
      - count
      title: ConstraintIntervalResponse
      description: 'Year/month/day-level statistics for constraint binding intervals.


        Year/month/day grouping uses the market''s local calendar.

        Year: months with data and count in each.

        Month: days with data and count in each.

        Day: canonical UTC timestamps (YYYY-MM-DDTHH:MM:SSZ) for unique intervals.'
    ConstraintBindingHeatMapRowSummaryResponse:
      properties:
        constraint_gs_entity_id:
          type: string
          title: Constraint Gs Entity Id
        contingency_gs_entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Contingency Gs Entity Id
        metrics:
          $ref: '#/components/schemas/ConstraintBindingHeatMapMetrics'
      type: object
      required:
      - constraint_gs_entity_id
      - metrics
      title: ConstraintBindingHeatMapRowSummaryResponse
    ShiftFactorLocationResponse:
      properties:
        location_gs_entity_id:
          type: string
          title: Location Gs Entity Id
        estimated_shift_factor:
          type: number
          title: Estimated Shift Factor
        location:
          type: string
          title: Location
      type: object
      required:
      - location_gs_entity_id
      - estimated_shift_factor
      - location
      title: ShiftFactorLocationResponse
      description: Linear estimated shift factor aggregated per location for a constraint.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ConstraintResponse:
      properties:
        gs_entity_id:
          type: string
          title: Gs Entity Id
        constraint_name:
          type: string
          title: Constraint Name
        market_id:
          type: string
          title: Market Id
        earliest_seen_utc:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Earliest Seen Utc
        latest_seen_utc:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Latest Seen Utc
        available_datasets:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Available Datasets
        rt_absolute_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Rt Absolute Cost
        da_absolute_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Da Absolute Cost
        gs_created_at_utc:
