        Optional ``contingency_id`` restricts rows to a single contingency.

        Optional ``dataset_id`` filters on ``source_dataset``.

        When ``exclude_zeros`` is true, source rows with ``estimated_shift_factor``

        equal to zero are dropped before aggregating per location.'
      operationId: list_shift_factors_v1_constraints__constraint_id__shift_factors_get
      parameters:
      - name: constraint_id
        in: path
        required: true
        schema:
          type: string
          title: Constraint ID
          description: GS entity ID of the constraint to get shift factors for
        description: GS entity ID of the constraint to get shift factors for
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: contingency_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Contingency ID
          description: When set, only include rows with this contingency_gs_entity_id
        description: When set, only include rows with this contingency_gs_entity_id
      - name: dataset_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset ID
          description: When set, only include rows with this source_dataset
        description: When set, only include rows with this source_dataset
      - name: exclude_zeros
        in: query
        required: false
        schema:
          type: boolean
          title: Exclude zeros
          description: When true, exclude rows where estimated_shift_factor is zero before aggregating each group
          default: false
        description: When true, exclude rows where estimated_shift_factor is zero before aggregating each group
      - name: aggregation_function
        in: query
        required: false
        schema:
          enum:
          - mean
          - max
          - min
          - median
          type: string
          title: Aggregation function
          description: 'Function used to combine source rows in each group: mean, max, min, or median'
          default: mean
        description: 'Function used to combine source rows in each group: mean, max, min, or median'
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftFactorLocationResponse'
                title: Response List Shift Factors V1 Constraints  Constraint Id  Shift Factors Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /constraints/{constraint_id}/location:
    get:
      tags:
      - Constraints
      summary: Get Constraint Location
      description: 'Retrieve start/end substation coordinates for a constraint.


        Returns nullable ``start`` and ``end`` lat/lon from the market''s constraint

        geometry table. Markets without a geometry table return 400. Unknown constraint

        ids return 404.'
      operationId: get_constraint_location_v1_constraints__constraint_id__location_get
      parameters:
      - name: constraint_id
        in: path
        required: true
        schema:
          type: string
          title: Constraint ID
          description: GS entity ID of the constraint to get facility location for
        description: GS entity ID of the constraint to get facility location for
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
