openapi: 3.2.0
info:
  title: Grid Status Constraints API
  version: 1.3.0
servers:
- url: https://api.gridstatus.io/v1
tags:
- name: Constraints
paths:
  /constraints:
    get:
      tags:
      - Constraints
      summary: List Constraints
      description: 'Get a list of constraints with optional filtering by ISOs and a search term.


        Returns constraints where market_id matches an item in the comma-separated

        isos list and constraint_name contains the search term. When sort_order is

        not specified and there is a search term, results are sorted by relevance

        (shorter constraint_names first). When sort_order is not specified, there is no

        search term, and include_absolute_costs is false, results are sorted by

        latest_seen_utc descending (most recently seen first), then market_id ascending,

        then constraint_name ascending. When include_absolute_costs is true and there is

        no search term, results are sorted by rt_absolute_cost descending with nulls last.


        Use include_absolute_costs, include_timestamps, and include_dataset_metadata to opt

        into rt_absolute_cost/da_absolute_cost, GS timestamps, and pricing dataset metadata.'
      operationId: list_constraints_v1_constraints_get
      parameters:
      - name: include_absolute_costs
        in: query
        required: false
        schema:
          type: boolean
          description: When true, include rt_absolute_cost and da_absolute_cost on each constraint. Uses absolute_cost_start_time and absolute_cost_end_time when provided.
          default: false
          title: Include Absolute Costs
        description: When true, include rt_absolute_cost and da_absolute_cost on each constraint. Uses absolute_cost_start_time and absolute_cost_end_time when provided.
      - name: include_timestamps
        in: query
        required: false
        schema:
          type: boolean
          description: When true, include gs_created_at_utc and gs_updated_at_utc.
          default: false
          title: Include Timestamps
        description: When true, include gs_created_at_utc and gs_updated_at_utc.
      - name: include_dataset_metadata
        in: query
        required: false
        schema:
          type: boolean
          description: When true, include dataset_metadata with pricing dataset specs.
          default: false
          title: Include Dataset Metadata
        description: When true, include dataset_metadata with pricing dataset specs.
      - name: absolute_cost_start_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Optional lower bound for the absolute cost window. When set, include rows where time index >= absolute_cost_start_time. Only used when include_absolute_costs is true.
          title: Absolute Cost Start Time
        description: Optional lower bound for the absolute cost window. When set, include rows where time index >= absolute_cost_start_time. Only used when include_absolute_costs is true.
      - name: absolute_cost_end_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Optional upper bound for the absolute cost window. When set, include rows where time index < absolute_cost_end_time. Only used when include_absolute_costs is true.
          title: Absolute Cost End Time
        description: Optional upper bound for the absolute cost window. When set, include rows where time index < absolute_cost_end_time. Only used when include_absolute_costs is true.
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: isos
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated list of market IDs to filter by
          title: Isos
        description: Comma-separated list of market IDs to filter by
      - name: active_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter latest_seen_utc to be on or after this timestamp
          title: Active After
        description: Filter latest_seen_utc to be on or after this timestamp
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100000
            minimum: 0
          - type: 'null'
          description: 'Maximum number of results to return (default: 10000)'
          default: 10000
          title: Limit
        description: 'Maximum number of results to return (default: 10000)'
      - name: sort_order
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderBy'
          - type: 'null'
          description: 'Sort order: asc or desc. Defaults to desc when omitted.'
          title: Sort Order
        description: 'Sort order: asc or desc. Defaults to desc when omitted.'
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional search term to filter by constraint_name
          title: Search
        description: Optional search term to filter by constraint_name
      - name: sort_column
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - constraint_name
            - market_id
            - earliest_seen_utc
            - latest_seen_utc
            type: string
          - type: 'null'
          description: 'Column to sort by. Must be one of: constraint_name, market_id, earliest_seen_utc, latest_seen_utc'
          title: Sort Column
        description: 'Column to sort by. Must be one of: constraint_name, market_id, earliest_seen_utc, latest_seen_utc'
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintsListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /constraints/contingencies:
    get:
      tags:
      - Constraints
      summary: List Contingencies
      description: 'Get a list of contingencies with optional filtering by ISOs and a search term.


        Returns all rows and columns from the contingencies table where market_id

        matches an item in the comma-separated isos list and contingency_name

        contains the search term. When sort_order is not specified and there is a

        search term, results are sorted by relevance (shorter contingency_names

        first). When sort_order is not specified and there is no search term,

        results are sorted by latest_seen_utc descending (most recently seen first),

        then market_id ascending, then contingency_name ascending for consistent

        ordering.


        Args:

        params: Query parameters (isos, search, active_after, limit,

        sort_column, sort_order)'
      operationId: list_contingencies_v1_constraints_contingencies_get
      parameters:
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: isos
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated list of market IDs to filter by
          title: Isos
        description: Comma-separated list of market IDs to filter by
      - name: active_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter latest_seen_utc to be on or after this timestamp
          title: Active After
        description: Filter latest_seen_utc to be on or after this timestamp
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100000
            minimum: 0
          - type: 'null'
          description: 'Maximum number of results to return (default: 10000)'
          default: 10000
          title: Limit
        description: 'Maximum number of results to return (default: 10000)'
      - name: sort_order
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderBy'
          - type: 'null'
          description: 'Sort order: asc or desc. Defaults to desc when omitted.'
          title: Sort Order
        description: 'Sort order: asc or desc. Defaults to desc when omitted.'
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional search term to filter by contingency_name
          title: Search
        description: Optional search term to filter by contingency_name
      - name: sort_column
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - contingency_name
            - market_id
            - earliest_seen_utc
            - latest_seen_utc
            type: string
          - type: 'null'
          description: 'Column to sort by. Must be one of: contingency_name, market_id, earliest_seen_utc, latest_seen_utc'
          title: Sort Column
        description: 'Column to sort by. Must be one of: contingency_name, market_id, earliest_seen_utc, latest_seen_utc'
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContingencyListResponse'
                title: Response List Contingencies V1 Constraints Contingencies Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /constraints/locations/{location_gs_entity_id}/shift-factors:
    get:
      tags:
      - Constraints
      summary: List Shift Factors For Location
      description: 'Retrieve estimated shift factors for a pricing location.


        Queries ClickHouse ``linear_estimated_shift_factors`` for the given

        location, returning one row per ``constraint_gs_entity_id``. When multiple

        source rows share the same constraint, ``estimated_shift_factor`` is

        aggregated per ``aggregation_function`` (mean, max, min, or median).

        Optional ``contingency_id`` restricts rows to a single contingency.

        Optional ``dataset_id`` filters on ``source_dataset``.

        When ``exclude_zeros`` is true, source rows with ``estimated_shift_factor``

        equal to zero are dropped before aggregating per constraint.'
      operationId: list_shift_factors_for_location_v1_constraints_locations__location_gs_entity_id__shift_factors_get
      parameters:
      - name: location_gs_entity_id
        in: path
        required: true
        schema:
          type: string
          title: Location Gs Entity Id
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: contingency_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Contingency ID
          description: When set, only include rows with this contingency_gs_entity_id
        description: When set, only include rows with this contingency_gs_entity_id
      - name: dataset_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset ID
          description: When set, only include rows with this source_dataset
        description: When set, only include rows with this source_dataset
      - name: exclude_zeros
        in: query
        required: false
        schema:
          type: boolean
          title: Exclude zeros
          description: When true, exclude rows where estimated_shift_factor is zero before aggregating each group
          default: false
        description: When true, exclude rows where estimated_shift_factor is zero before aggregating each group
      - name: aggregation_function
        in: query
        required: false
        schema:
          enum:
          - mean
          - max
          - min
          - median
          type: string
          title: Aggregation function
          description: 'Function used to combine source rows in each group: mean, max, min, or median'
          default: mean
        description: 'Function used to combine source rows in each group: mean, max, min, or median'
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftFactorConstraintResponse'
                title: Response List Shift Factors For Location V1 Constraints Locations  Location Gs Entity Id  Shift Factors Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /constraints/locations/{location_gs_entity_id}/constraint-costs:
    get:
      tags:
      - Constraints
      summary: List Constraint Costs For Location
      description: 'Get location-adjusted constraint costs over a time range.


        The endpoint computes absolute cost per constraint/contingency pair from the

        specified constraint dataset in ClickHouse, then multiplies each by the

        location''s aggregated shift factor (mean) from

        ``linear_estimated_shift_factors`` for the same dataset.

        For datasets without ``contingency_gs_entity_id``, costs are computed per

        constraint and reused across that constraint''s shift-factor contingency rows.


        Pass ``group_by=constraint`` to roll contingency-grained rows up to one row

        per constraint (sum of ``adjusted_cost``, mean ``shift_factor``; contingency

        fields are null). ``absolute_cost`` is summed when the dataset has a

        contingency column; otherwise the shared per-constraint cost is kept once.'
      operationId: list_constraint_costs_for_location_v1_constraints_locations__location_gs_entity_id__constraint_costs_get
      parameters:
      - name: location_gs_entity_id
        in: path
        required: true
        schema:
          type: string
          title: Location Gs Entity Id
      - name: dataset_id
        in: query
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: start_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Filter to rows where time index >= start_time (ISO 8601)
          title: Start Time
        description: Filter to rows where time index >= start_time (ISO 8601)
      - name: end_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Filter to rows where time index < end_time (ISO 8601)
          title: End Time
        description: Filter to rows where time index < end_time (ISO 8601)
      - name: group_by
        in: query
        required: false
        schema:
          enum:
          - constraint
          - constraint_contingency
          type: string
          description: Row grain. `constraint_contingency` (default) returns one row per constraint/contingency pair. `constraint` rolls those rows up to one row per constraint (sum of adjusted_cost, mean shift factor; absolute_cost summed only when the dataset has a contingency column).
          default: constraint_contingency
          title: Group By
        description: Row grain. `constraint_contingency` (default) returns one row per constraint/contingency pair. `constraint` rolls those rows up to one row per constraint (sum of adjusted_cost, mean shift factor; absolute_cost summed only when the dataset has a contingency column).
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationConstraintCostResponse'
                title: Response List Constraint Costs For Location V1 Constraints Locations  Location Gs Entity Id  Constraint Costs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
