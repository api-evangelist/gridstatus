  /constraints/binding/locations:
    get:
      tags:
      - Constraints
      summary: List Binding Constraints With Locations
      description: 'Get unique binding constraints for a dataset/time window with locations.


        Scans binding observations for ``dataset_id`` in ``[start_time, end_time)``,

        collapses peak-|shadow| per (constraint, interval), keeps the top

        ``limit`` constraints by peak |shadow|, joins facility coordinates and

        contingency identity/names, and returns one object per constraint with

        nested observations, ordered by that ranking.'
      operationId: list_binding_constraints_with_locations_v1_constraints_binding_locations_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          description: Maximum number of unique binding constraints to return (all intervals for each are included).
          default: 50000
          title: Limit
        description: Maximum number of unique binding constraints to return (all intervals for each are included).
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: dataset_id
        in: query
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: start_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Filter to rows where time index >= start_time (ISO 8601)
          title: Start Time
        description: Filter to rows where time index >= start_time (ISO 8601)
      - name: end_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Filter to rows where time index < end_time (ISO 8601 timestamp)
          title: End Time
        description: Filter to rows where time index < end_time (ISO 8601 timestamp)
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingConstraintsWithLocationsResponse'
        '422':
          description: Validation Error
          content:
