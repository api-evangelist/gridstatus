                  interval_end_local: '2018-04-10T00:10:00-07:00'
                  interval_end_utc: '2018-04-10T07:10:00+00:00'
                  load: 22371
                - interval_start_local: '2018-04-10T00:10:00-07:00'
                  interval_start_utc: '2018-04-10T07:10:00+00:00'
