openapi: 3.2.0
info:
  title: Grid Status Query Data API
  version: 1.3.0
servers:
- url: https://api.gridstatus.io/v1
tags:
- name: Query Data
paths:
  /datasets/{dataset_id}/query:
    get:
      tags:
      - Query Data
      summary: Query Dataset
      description: 'Query a dataset and return matching rows as JSON or CSV.


        JSON rows stream directly from a Postgres server-side cursor instead of

        being buffered in memory first (JSON only; CSV and external datasets always

        buffer). The result-dependent ``X-Has-Next-Page`` and ``X-rows-in-response``

        headers are omitted from streamed responses -- read pagination from the JSON

        ``meta.hasNextPage`` and ``meta.cursor`` fields.'
      operationId: query_dataset_v1_datasets__dataset_id__query_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          title: Dataset ID
          description: ID of the dataset to query
        description: ID of the dataset to query
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderBy'
          - type: 'null'
          description: The order to order results by
          default: asc
          title: Order
        description: The order to order results by
      - name: filter_column
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The column to filter results by
          title: Filter Column
        description: The column to filter results by
      - name: filter_value
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: number
          - type: string
          - type: 'null'
          description: The value to filter results by
          title: Filter Value
        description: The value to filter results by
      - name: filter_operator
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FilterOperator'
          - type: 'null'
          default: '='
          title: Filter Operator
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: The maximum number of rows to return across all pages
          title: Limit
        description: The maximum number of rows to return across all pages
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: The page number of results to return
          default: 1
          title: Page
        description: The page number of results to return
      - name: page_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: The maximum number of rows to return in a single page
          title: Page Size
        description: The maximum number of rows to return in a single page
      - name: columns
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: string
          - type: 'null'
          description: Comma separated list of columns to return. Defaults to all columns.
          title: Columns
        description: Comma separated list of columns to return. Defaults to all columns.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: timezone
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The timezone to use when interpreting timezone naive timestamps, resampling to frequencies one day or more, and returning results. A value of `market`can be provided to return results in the timezone of the source ISO for the dataset. If `market` is specified and the dataset does not have a source ISO, the timezone will default to UTC for the query. When provided, columns in the `timezone` will be suffixed with `_local`.
          default: UTC
          title: Timezone
        description: The timezone to use when interpreting timezone naive timestamps, resampling to frequencies one day or more, and returning results. A value of `market`can be provided to return results in the timezone of the source ISO for the dataset. If `market` is specified and the dataset does not have a source ISO, the timezone will default to UTC for the query. When provided, columns in the `timezone` will be suffixed with `_local`.
      - name: time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - type: 'null'
          description: 'The time to filter results. Cannot be used with start_time or end_time.


            Possible values:


            - ''latest'': Fetches the most recently reported data point.


            - A specific timestamp string (ISO 8601 format): Returns records that were published at the provided timestamp.


            '
          title: Time
        description: 'The time to filter results. Cannot be used with start_time or end_time.


          Possible values:


          - ''latest'': Fetches the most recently reported data point.


          - A specific timestamp string (ISO 8601 format): Returns records that were published at the provided timestamp.


          '
      - name: time_comparison
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - '='
            - '>'
            - '>='
            - <
            - <=
            type: string
          - type: 'null'
          description: 'The comparison operator to use when filtering by time.


            Possible values:


            - ''='': Fetches the data at the exact time.


            - ''>'': Fetches the earliest data after the provided time.


            - ''>='': Fetches the earliest data on or after the provided time.


            - ''<'': Fetches the latest data before the provided time.


            - ''<='': Fetches the latest data on or before the provided time.


            '
          default: '='
          title: Time Comparison
        description: 'The comparison operator to use when filtering by time.


          Possible values:


          - ''='': Fetches the data at the exact time.


          - ''>'': Fetches the earliest data after the provided time.


          - ''>='': Fetches the earliest data on or after the provided time.


          - ''<'': Fetches the latest data before the provided time.


          - ''<='': Fetches the latest data on or before the provided time.


          '
      - name: start_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - type: 'null'
          description: The start time to filter results using the dataset's time_index_column. Data on or after this time will be returned. Only applies to datasets with a time_index_column
          title: Start Time
        description: The start time to filter results using the dataset's time_index_column. Data on or after this time will be returned. Only applies to datasets with a time_index_column
      - name: end_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - type: 'null'
          description: The end time to filter results using the dataset's time_index_column. Data before this time will be returned. Only applies to datasets with a time_index_column
          title: End Time
        description: The end time to filter results using the dataset's time_index_column. Data before this time will be returned. Only applies to datasets with a time_index_column
      - name: publish_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - type: 'null'
          description: "Controls the filtering based on the dataset's publish time.\n\nCannot be combined with publish_time_start or publish_time_end.Note: a dataset must have a time index column to use 'latest' or 'latest_before:' options.\n\nPossible values:\n\n- 'latest_report': Returns records only from the most recently published report.\n\n- 'latest': For any given timestamp, fetches the most recently reported data point associated with it.\n\n- A specific timestamp string (ISO 8601 format): Returns records that were published at the provided timestamp.\n\n- 'latest_before:<offset>': Return the most recent forecast for each operating time where publish_time <= operating_time + offset (e.g., 'latest_before:-6 hours').\n\n - 'latest_before': shorthand for 'latest_before:-0 hours'. Used to get the most recent forecast prior to each operating time. This is useful because some forecasts are published after the operating time they are forecasting for.\n\n- 'latest_before:<offset>@<HH:MM:SS>': Return the latest forecast published before the specified time on the offset day (e.g., 'latest_before:-1 day@10:00:00').\n\n - 'window':<offset>: Returns all forecasts for each operating time published between the specified offset from the operating time and the operating time. In other words, where operating_time + offset <= publish_time <= operating_time. (e.g., 'window:-6 hours').\n\n - 'window:<offset>@<HH:MM:SS>': Returns all forecasts for each operating time published between the specified time on the offset day from the operating time and the operating time (e.g., 'window:-1 day@10:00:00').\n\n- None: No filtering based on publish time.\n\n"
          title: Publish Time
        description: "Controls the filtering based on the dataset's publish time.\n\nCannot be combined with publish_time_start or publish_time_end.Note: a dataset must have a time index column to use 'latest' or 'latest_before:' options.\n\nPossible values:\n\n- 'latest_report': Returns records only from the most recently published report.\n\n- 'latest': For any given timestamp, fetches the most recently reported data point associated with it.\n\n- A specific timestamp string (ISO 8601 format): Returns records that were published at the provided timestamp.\n\n- 'latest_before:<offset>': Return the most recent forecast for each operating time where publish_time <= operating_time + offset (e.g., 'latest_before:-6 hours').\n\n - 'latest_before': shorthand for 'latest_before:-0 hours'. Used to get the most recent forecast prior to each operating time. This is useful because some forecasts are published after the operating time they are forecasting for.\n\n- 'latest_before:<offset>@<HH:MM:SS>': Return the latest forecast published before the specified time on the offset day (e.g., 'latest_before:-1 day@10:00:00').\n\n - 'window':<offset>: Returns all forecasts for each operating time published between the specified offset from the operating time and the operating time. In other words, where operating_time + offset <= publish_time <= operating_time. (e.g., 'window:-6 hours').\n\n - 'window:<offset>@<HH:MM:SS>': Returns all forecasts for each operating time published between the specified time on the offset day from the operating time and the operating time (e.g., 'window:-1 day@10:00:00').\n\n- None: No filtering based on publish time.\n\n"
      - name: publish_time_start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - type: 'null'
          description: The start time to filter results using the dataset's publish_time_column. Data on or after this time will be returned up to the publish_time_end if provided. Only applies to datasets with a publish_time_column. Cannot be used with publish_time.
          title: Publish Time Start
        description: The start time to filter results using the dataset's publish_time_column. Data on or after this time will be returned up to the publish_time_end if provided. Only applies to datasets with a publish_time_column. Cannot be used with publish_time.
      - name: publish_time_end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - type: 'null'
          description: The end time to filter results using the dataset's publish_index_column. Data before this time will be returned down the publish_time_start if provided. Only applies to datasets with a publish_time_column. Cannot be used with publish_time.
          title: Publish Time End
        description: The end time to filter results using the dataset's publish_index_column. Data before this time will be returned down the publish_time_start if provided. Only applies to datasets with a publish_time_column. Cannot be used with publish_time.
      - name: resample_frequency
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The frequency to resample the data to. Must be one of:


            - "1 minute"

            - "5 minutes"

            - "10 minutes"

            - "15 minutes"

            - "1 hour"

            - "1 day"

            - "1 week"

            - "1 month"

            - "1 year"


            When resampling_frequency is specified, start_time and end_time values must also be provided. The only exception to this is when querying datasets that have a publish time and the publish time is specified as a specific timestamp or ''latest_report''.


            Additionally, the number of days of data that can be queried is limited based on the resample frequency. The maximum number of days of data that can be queried for each resample frequency is listed below. There is no limit on days for resample frequencies not listed below.


            - 1 minute: 31 days

            - 5 minutes: 100 days

            - 10 minutes: 120 days

            - 15 minutes: 180 days

            - 1 hour: 365 days

            - 1 day: 1825 days'
          title: Resample Frequency
        description: 'The frequency to resample the data to. Must be one of:


          - "1 minute"

          - "5 minutes"

          - "10 minutes"

          - "15 minutes"

          - "1 hour"

          - "1 day"

          - "1 week"

          - "1 month"

          - "1 year"


          When resampling_frequency is specified, start_time and end_time values must also be provided. The only exception to this is when querying datasets that have a publish time and the publish time is specified as a specific timestamp or ''latest_report''.


          Additionally, the number of days of data that can be queried is limited based on the resample frequency. The maximum number of days of data that can be queried for each resample frequency is listed below. There is no limit on days for resample frequencies not listed below.


          - 1 minute: 31 days

          - 5 minutes: 100 days

          - 10 minutes: 120 days

          - 15 minutes: 180 days

          - 1 hour: 365 days

          - 1 day: 1825 days'
      - name: resample_by
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: string
          - type: 'null'
          description: "A comma separated list of columns to group by before resampling. \n\n- When resampling, the data is always grouped by the time index column of the dataset.\n\n- If a value is provided for resample_by, the data will be grouped by the provided columns in addition to the time index column.\n\n- If the dataset has a subseries index and no value is provided for resample_by, the data will also be grouped by the subseries index column.\n\n- If the dataset has a publish time column and the publish_time parameter is not 'latest', the data will also be grouped by the publish time column."
          title: Resample By
        description: "A comma separated list of columns to group by before resampling. \n\n- When resampling, the data is always grouped by the time index column of the dataset.\n\n- If a value is provided for resample_by, the data will be grouped by the provided columns in addition to the time index column.\n\n- If the dataset has a subseries index and no value is provided for resample_by, the data will also be grouped by the subseries index column.\n\n- If the dataset has a publish time column and the publish_time parameter is not 'latest', the data will also be grouped by the publish time column."
      - name: resample_function
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ResampleFunction'
          - type: 'null'
          description: The function to use when resampling. Defaults to "mean". Possible values are "mean", "sum", "min", "max", "count", "stddev", "variance". If resample is None, this is ignored.
          default: mean
          title: Resample Function
        description: The function to use when resampling. Defaults to "mean". Possible values are "mean", "sum", "min", "max", "count", "stddev", "variance". If resample is None, this is ignored.
      - name: return_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ReturnFormat'
          description: The return format of the response
          default: json
        description: The return format of the response
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to download the file or not
          default: false
          title: Download
        description: Whether to download the file or not
      - name: json_schema
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JSONSchema'
          description: The json schema of the response
          default: array-of-objects
        description: The json schema of the response
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/QueryDatasetResponse'
                - $ref: '#/components/schemas/CSVResponse'
                title: Response Query Dataset V1 Datasets  Dataset Id  Query Get
              example:
