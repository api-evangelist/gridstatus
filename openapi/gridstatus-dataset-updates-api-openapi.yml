components:
  schemas:
    ReturnFormat:
      type: string
      enum:
      - json
      - csv
      title: ReturnFormat
    DatasetUpdatesResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
        data:
          items:
            $ref: '#/components/schemas/DatasetUpdateResponse'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/MetadataResponse'
      type: object
      required:
      - status_code
      - data
      - meta
      title: DatasetUpdatesResponse
    DatasetUpdateResponse:
      properties:
        id:
          type: string
          title: Id
        dataset:
          type: string
          title: Dataset
        time_utc:
          type: string
          format: date-time
          title: Time Utc
        num_rows_updated:
          type: integer
          title: Num Rows Updated
        num_rows_inserted:
          type: integer
          title: Num Rows Inserted
        is_backfill:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Backfill
      type: object
      required:
      - id
      - dataset
      - time_utc
      - num_rows_updated
      - num_rows_inserted
      - is_backfill
      title: DatasetUpdateResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    JSONSchema:
      type: string
      enum:
      - array-of-objects
      - array-of-arrays
      title: JSONSchema
    MetadataResponse:
      properties:
        page:
          type: integer
          title: Page
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
        page_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Size
        hasNextPage:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Hasnextpage
        cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      type: object
      required:
      - page
      - limit
      - page_size
      - hasNextPage
      - cursor
      title: MetadataResponse
    OrderBy:
      type: string
      enum:
      - asc
      - desc
      title: OrderBy
