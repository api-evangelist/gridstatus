openapi: 3.2.0
info:
  title: Grid Status Dataset Updates API
  version: 1.3.0
servers:
- url: https://api.gridstatus.io/v1
tags:
- name: Dataset Updates
paths:
  /dataset-updates/{dataset_id}:
    get:
      tags:
      - Dataset Updates
      summary: Dataset Updates
      description: 'List all updates that have occurred in chronological order

        for a specific dataset'
      operationId: dataset_updates_v1_dataset_updates__dataset_id__get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: return_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ReturnFormat'
          description: The return format of the response
          default: json
        description: The return format of the response
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to download the file or not
          default: false
          title: Download
        description: Whether to download the file or not
      - name: json_schema
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JSONSchema'
          description: The json schema of the response
          default: array-of-objects
        description: The json schema of the response
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderBy'
          - type: 'null'
          description: The order to order results by
          default: desc
          title: Order
        description: The order to order results by
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: The maximum number of rows to return across all pages
          title: Limit
        description: The maximum number of rows to return across all pages
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetUpdatesResponse'
              example:
                status_code: 200
                data:
                - id: 18759731
