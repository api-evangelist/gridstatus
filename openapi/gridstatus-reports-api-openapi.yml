components:
  schemas:
    PeakDamLmpResponse:
      additionalProperties:
        anyOf:
        - type: number
        - type: string
          format: date-time
        - type: string
        - type: 'null'
      type: object
    ISOEnum:
      type: string
      enum:
      - CAISO
      - ERCOT
      - IESO
      - ISONE
      - MISO
      - NYISO
      - PJM
      - SPP
      title: ISOEnum
    PeakLoadReportResponse:
      properties:
        ISO:
          type: string
          title: Iso
        market_date:
          type: string
          format: date
          title: Market Date
        timezone:
          type: string
          title: Timezone
        peak_dam_lmp:
          anyOf:
          - items:
              $ref: '#/components/schemas/PeakDamLmpResponse'
            type: array
          - type: 'null'
          title: Peak Dam Lmp
        peak_load:
          anyOf:
          - $ref: '#/components/schemas/PeakIntervalResponse'
          - type: 'null'
        peak_net_load:
          anyOf:
          - $ref: '#/components/schemas/PeakIntervalResponse'
          - type: 'null'
      type: object
      required:
      - ISO
      - market_date
      - timezone
      title: PeakLoadReportResponse
    PeakIntervalResponse:
      properties:
        interval_start_market:
          type: string
          format: date-time
          title: Interval Start Market
        interval_end_market:
          type: string
          format: date-time
          title: Interval End Market
        load:
          type: number
          title: Load
        net_load:
          type: number
          title: Net Load
      additionalProperties:
        anyOf:
        - type: number
        - type: 'null'
      type: object
      required:
      - interval_start_market
      - interval_end_market
      - load
      - net_load
      title: PeakIntervalResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
