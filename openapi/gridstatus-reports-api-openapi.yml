openapi: 3.2.0
info:
  title: Grid Status Reports API
  version: 1.3.0
servers:
- url: https://api.gridstatus.io/v1
tags:
- name: Reports
paths:
  /reports/daily_peak/{iso}:
    get:
      tags:
      - Reports
      summary: Get Daily Peak Report
      description: 'Get a daily peak report for the specified ISO on the specified date. If multiple peaks in LMP values are found in the Day Ahead Market data for a given zone, only data for the first peak will be returned.


        NOTE: You must be on a paid Grid Status plan to access this endpoint.'
      operationId: get_daily_peak_report_v1_reports_daily_peak__iso__get
      parameters:
      - name: iso
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ISOEnum'
          title: ISO Name
          description: Name of the iso for which the report should be created
        description: Name of the iso for which the report should be created
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: date
          description: The date for which the report should be generated.
        description: The date for which the report should be generated.
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeakLoadReportResponse'
