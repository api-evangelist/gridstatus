  /datasets/{dataset_id}:
    get:
      tags:
      - Dataset Metadata
      summary: Get Dataset Metadata
      description: Get a dataset and its metadata
      operationId: get_dataset_metadata_v1_datasets__dataset_id__get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: return_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ReturnFormat'
          description: The return format of the response
          default: json
        description: The return format of the response
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to download the file or not
          default: false
          title: Download
        description: Whether to download the file or not
      - name: json_schema
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JSONSchema'
          description: The json schema of the response
          default: array-of-objects
        description: The json schema of the response
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
              example:
                id: ercot_lmp_by_bus
                name: ERCOT LMP By Bus
                description: "The Locational Marginal Price for each Electrical Bus in ERCOT,\nnormally produced by SCED every five minutes. \n\nThe location type present is:\n\n- *Electrical Bus*\n\nSee list of available locations\nby using the `ercot_electrical_buses` dataset."
                earliest_available_time_utc: '2020-01-01T06:00:26Z'
                latest_available_time_utc: '2025-05-19T19:25:12Z'
                source: ercot
                last_checked_time_utc: '2025-05-19T19:25:59.143841Z'
                primary_key_columns:
                - sced_timestamp_utc
                - location
                time_index_column: sced_timestamp_utc
                subseries_index_column: location
                all_columns:
                - name: sced_timestamp_utc
                  type: TIMESTAMP
                  is_numeric: false
                  is_date: false
                  is_datetime: true
                - name: market
                  type: VARCHAR
                  is_numeric: false
                  is_date: false
                  is_datetime: false
                - name: location
                  type: VARCHAR
                  is_numeric: false
                  is_date: false
                  is_datetime: false
                - name: location_type
                  type: VARCHAR
                  is_numeric: false
                  is_date: false
                  is_datetime: false
                - name: lmp
                  type: DOUBLE PRECISION
                  is_numeric: true
                  is_date: false
                  is_datetime: false
                number_of_rows_approximate: 8444429824
                table_type: table
                is_in_snowflake: true
                data_frequency: ERCOT_SCED_RUN
                source_url: https://www.ercot.com/mp/data-products/data-product-details?id=NP6-787-CD
                is_published: true
                created_at_utc: '2023-10-10T17:37:45.625368Z'
                status: active
                popularity_rank: 46
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ReturnFormat:
      type: string
      enum:
      - json
      - csv
      title: ReturnFormat
    DatasetStatusEnum:
      type: string
      enum:
      - retired
      - active
      - deprecated
      title: DatasetStatusEnum
    ListDatasetsResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
        data:
          items:
            $ref: '#/components/schemas/DatasetResponse'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/MetadataResponse'
        dataset_metadata:
          $ref: '#/components/schemas/ListDatasetsDatasetMetadataResponse'
      type: object
      required:
      - status_code
      - data
      - meta
      - dataset_metadata
      title: ListDatasetsResponse
      examples:
