                    is_datetime: false
                  - name: solar_curtailed_for_energy
                    type: DOUBLE PRECISION
                    is_numeric: true
                    is_date: false
                    is_datetime: false
                  number_of_rows_approximate: 1141332
                  table_type: table
                  is_in_snowflake: true
                  data_frequency: 5_MINUTES
                  source_url: https://marketplace.spp.org/pages/ver-curtailments
                  is_published: true
                  created_at_utc: '2023-05-17T17:21:02.118072Z'
                  status: active
                meta:
                  page: 1
                dataset_metadata:
                  resample_conversion:
                    1_MINUTE: 60
                    5_MINUTES: 300
                    15_MINUTES: 900
                    1_HOUR: 3600
                    1_DAY: 86400
                    1_DAY_MARKET: 86400
                    1_WEEK: 604800
                    1_MONTH: 2592000
                    1_YEAR: 31536000
                    IRREGULAR: -1
