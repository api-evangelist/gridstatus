openapi: 3.2.0
info:
  title: Grid Status Dataset Metadata API
  version: 1.3.0
servers:
- url: https://api.gridstatus.io/v1
tags:
- name: Dataset Metadata
paths:
  /datasets:
    get:
      tags:
      - Dataset Metadata
      summary: List Datasets
      description: 'List all published datasets a user has access to


        See list of available datasets here: https://www.gridstatus.io/datasets'
      operationId: list_datasets_v1_datasets_get
      parameters:
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (query)
          title: Api Key
        description: API key for authentication (query)
      - name: return_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ReturnFormat'
          description: The return format of the response
          default: json
        description: The return format of the response
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to download the file or not
          default: false
          title: Download
        description: Whether to download the file or not
      - name: json_schema
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JSONSchema'
          description: The json schema of the response
          default: array-of-objects
        description: The json schema of the response
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication (header)
          title: X-Api-Key
        description: API key for authentication (header)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDatasetsResponse'
              example:
                status_code: 200
                data:
                - id: caiso_as_prices
                  name: CAISO AS Prices
                  description: "Ancillary Services Prices as reported by CAISO.\n\n**AS Mapping**\n\nThe *_EXP show only the intertie resources.\n \n-    AS_SP26_P: Resources in AS_SP26\n-    AS_NP26_P: Resources in AS_NP26\n-    AS_SP15_P: Resources in AS_SP15\n-    AS_NP15_P: Resources in AS_NP15\n-    AS_SP26_EXP_P: Resources in AS_SP26_EXP which are not in AS_SP26\n-    AS_NP26_EXP_P: Resources in AS_NP26_EXP which are not in AS_NP26\n-    AS_SP15_EXP_P: Resources in AS_SP15_EXP which are not in AS_SP15\n-    AS_NP15_EXP_P: Resources in AS_NP15_EXP which are not in AS_NP15\n-    AS_CAISO_NP26_P: Resources in AS_CAISO which are not in AS_SP26\n-    AS_CAISO_SP26_P: Resources in AS_CAISO which are not in AS_NP26\n-    AS_CAISO_NP15_P: Resources in AS_CAISO which are not in AS_SP15\n-    AS_CAISO_SP15_P: Resources in AS_CAISO which are not in AS_NP15"
                  earliest_available_time_utc: '2010-01-01T08:00:00+00:00'
                  latest_available_time_utc: '2025-05-20T06:00:00+00:00'
                  source: caiso
                  last_checked_time_utc: '2025-05-19T19:10:58+00:00'
                  primary_key_columns:
                  - interval_start_utc
                  - region
                  - market
                  time_index_column: interval_start_utc
                  subseries_index_column: region
                  all_columns:
                  - name: interval_start_utc
                    type: TIMESTAMP
                    is_numeric: false
                    is_date: false
                    is_datetime: true
                  - name: interval_end_utc
                    type: TIMESTAMP
                    is_numeric: false
                    is_date: false
                    is_datetime: true
                  - name: region
                    type: VARCHAR
                    is_numeric: false
                    is_date: false
                    is_datetime: false
                  - name: market
                    type: VARCHAR
                    is_numeric: false
                    is_date: false
                    is_datetime: false
                  - name: non_spinning_reserves
                    type: DOUBLE PRECISION
                    is_numeric: true
                    is_date: false
                    is_datetime: false
                  - name: regulation_down
                    type: DOUBLE PRECISION
                    is_numeric: true
                    is_date: false
                    is_datetime: false
                  - name: regulation_mileage_down
                    type: DOUBLE PRECISION
                    is_numeric: true
                    is_date: false
                    is_datetime: false
                  - name: regulation_mileage_up
                    type: DOUBLE PRECISION
                    is_numeric: true
                    is_date: false
                    is_datetime: false
                  - name: regulation_up
                    type: DOUBLE PRECISION
                    is_numeric: true
                    is_date: false
                    is_datetime: false
                  - name: spinning_reserves
                    type: DOUBLE PRECISION
                    is_numeric: true
                    is_date: false
                    is_datetime: false
                  number_of_rows_approximate: 621445
                  table_type: table
                  is_in_snowflake: true
                  data_frequency: 1_HOUR
                  source_url: http://oasis.caiso.com/mrioasis/logon.do
                  is_published: true
                  created_at_utc: '2023-04-20T07:00:37.935862Z'
                  status: active
                  popularity_rank: 46
                - id: spp_ver_curtailments
                  name: SPP VER Curtailments
                  description: 'VER curtailment data in 5 minute intervals for SPP.

                    Total VER curtailment (not per resource).'
                  earliest_available_time_utc: '2014-03-01T06:00:00+00:00'
                  latest_available_time_utc: '2025-05-19T04:55:00+00:00'
                  source: spp
                  last_checked_time_utc: '2025-05-19T19:12:06+00:00'
                  primary_key_columns:
                  - interval_start_utc
                  time_index_column: interval_start_utc
                  all_columns:
                  - name: interval_start_utc
                    type: TIMESTAMP
                    is_numeric: false
                    is_date: false
                    is_datetime: true
                  - name: interval_end_utc
                    type: TIMESTAMP
                    is_numeric: false
                    is_date: false
                    is_datetime: true
                  - name: wind_redispatch_curtailments
                    type: DOUBLE PRECISION
                    is_numeric: true
