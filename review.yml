sources:
  - url: https://api.gridstatus.io/openapi.json
    type: OpenAPI
    note: Live OpenAPI 3.1 document (Grid Status API 1.3.0). Only GET paths; no WebSocket or SSE channels; fetched during the review.
  - url: https://docs.gridstatus.io/developers/getting-started/readme.md
    type: Documentation
    note: Base URL https://api.gridstatus.io/v1/ and x-api-key header authentication; key from gridstatus.io/settings/api.
  - url: https://docs.gridstatus.io/developers/api-reference/query-data
    type: APIReference
    note: Dataset query endpoint with time filters, resampling, pagination, JSON/CSV output, and X-Stream chunked streaming.
  - url: https://docs.gridstatus.io/developers/api-reference/api-usage
    type: APIReference
    note: GET /api_usage reports plan name plus rows-returned, requests, rows-per-response, and per-second/minute/hour limits.
  - url: https://github.com/gridstatus/gridstatusio
    type: SourceCode
    note: Official Python client for the hosted API (BSD-3-Clause). HTTP only; documents the 500,000 rows/month free plan limit.
  - url: https://github.com/gridstatus/gridstatus
    type: SourceCode
    note: Open-source library (BSD-3-Clause) pulling raw data directly from CAISO, ERCOT, ISONE, MISO, NYISO, PJM, SPP, IESO, AESO, and EIA. No WebSocket transport.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. The hosted Grid Status API is
    request/response REST (GET-only) over HTTPS, with optional client-initiated
    chunked streaming of query results via the X-Stream header and bulk
    downloads via presigned S3 URLs. There is no server-push transport
    (WebSocket or SSE) to model, so no AsyncAPI document was created.
