aid: gridstatus
name: Grid Status
review:
  question: Does Grid Status expose a documented public WebSocket API?
  answer: false
  date: '2026-07-11'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. The hosted Grid Status API
    (https://api.gridstatus.io/v1) is request/response REST over HTTPS - the
    live OpenAPI 3.1 document at https://api.gridstatus.io/openapi.json
    (version 1.3.0) declares only GET endpoints and no WebSocket or SSE
    channels. The query endpoint's optional X-Stream: true header streams JSON
    rows of a query result from a Postgres server-side cursor as a chunked
    HTTP response; it is client-initiated result streaming, not a server-push
    event transport, so there is nothing to model in AsyncAPI. Realtime
    freshness is achieved by polling the dataset-updates endpoint or the query
    endpoint with time=latest.
findings:
  summary: |
    Grid Status does not publish a documented public WebSocket API. The hosted
    Grid Status API is a REST (HTTPS) datasets-and-query surface at
    https://api.gridstatus.io/v1, authenticated with an API key in the
    x-api-key header (or an api_key query parameter) obtained from
    https://www.gridstatus.io/settings/api. Every documented endpoint is a GET:
    dataset catalog and metadata, dataset query (JSON/CSV with filters,
    resampling, and cursor pagination), dataset audit and updates, block
    pricing, daily peak reports (paid plans), pricing locations, transmission
    constraints (binding activity, shift factors, heat maps), bulk CSV exports
    via presigned S3 URLs, and API usage. No realtime, bidirectional, or
    streaming WebSocket (ws:// or wss://) endpoint appears in the live OpenAPI
    document, the docs at docs.gridstatus.io, or the official Python clients as
    of the review date. The Grid Status Live dashboard is a first-party web
    application, not a documented public streaming API.
  openSource: |
    Grid Status maintains two open-source Python libraries (both
    BSD-3-Clause): gridstatus (github.com/gridstatus/gridstatus), which pulls
    minimally-processed data directly from CAISO, ERCOT, ISONE, MISO, NYISO,
    PJM, SPP, IESO, AESO, and EIA sources without a Grid Status account, and
    gridstatusio (github.com/gridstatus/gridstatusio), the client for the
    hosted API. Both are HTTP request/response clients with no WebSocket
    transport.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.gridstatus.io/v1
      documented: true
      note: Hosted API. All documented endpoints are GET; API key via x-api-key header or api_key query parameter.
    - protocol: HTTP Streaming
      scheme: https
      documented: true
      note: Optional X-Stream true header on the dataset query endpoint streams JSON rows of a result set as a chunked response (JSON only). Client-initiated result streaming, not server push.
    - protocol: HTTP Download
      scheme: https
      documented: true
      note: Bulk CSV exports are fetched via presigned S3 URLs generated by the csv-exports endpoints.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in the live OpenAPI document, docs.gridstatus.io, or the official Python clients as of the review date.
  endpointsConfirmedRest:
    - GET https://api.gridstatus.io/v1/
    - GET https://api.gridstatus.io/v1/datasets
    - GET https://api.gridstatus.io/v1/datasets/{dataset_id}
    - GET https://api.gridstatus.io/v1/datasets/{dataset_id}/audit
    - GET https://api.gridstatus.io/v1/datasets/{dataset_id}/query
    - GET https://api.gridstatus.io/v1/datasets/{dataset_id}/query/{filter_column_id}/{filter_value_path}
    - GET https://api.gridstatus.io/v1/dataset-updates/{dataset_id}
    - GET https://api.gridstatus.io/v1/block-pricing/{iso}
    - GET https://api.gridstatus.io/v1/reports/daily_peak/{iso}
    - GET https://api.gridstatus.io/v1/api_usage
    - GET https://api.gridstatus.io/v1/csv-exports/{dataset_id}
    - GET https://api.gridstatus.io/v1/csv-exports/{dataset_id}/{export_date}
    - GET https://api.gridstatus.io/v1/constraints
    - GET https://api.gridstatus.io/v1/constraints/contingencies
    - GET https://api.gridstatus.io/v1/constraints/binding
    - GET https://api.gridstatus.io/v1/constraints/binding/counts
    - GET https://api.gridstatus.io/v1/constraints/binding/costs
    - GET https://api.gridstatus.io/v1/constraints/binding/heat_map
    - GET https://api.gridstatus.io/v1/constraints/{gs_entity_id}
    - GET https://api.gridstatus.io/v1/constraints/{constraint_id}/shift-factors
    - GET https://api.gridstatus.io/v1/constraints/{constraint_id}/stats
    - GET https://api.gridstatus.io/v1/constraints/{constraint_id}/intervals
    - GET https://api.gridstatus.io/v1/constraints/{constraint_id}/binding_intervals_by_hour
    - GET https://api.gridstatus.io/v1/constraints/{constraint_id}/contingencies
    - GET https://api.gridstatus.io/v1/constraints/locations/{location_gs_entity_id}/shift-factors
    - GET https://api.gridstatus.io/v1/constraints/locations/{location_gs_entity_id}/constraint-costs
    - GET https://api.gridstatus.io/v1/constraints/locations/{location_gs_entity_id}/constraint-impact
